  about:
    enable: true
    title: "About Me"
    image: "/img/a.jpg"
    content: |-
      I am an **AI platform and solutions architecture professional** with 8+ years of experience across academic research, startups, FinTech, and AI for Science. My work spans AI model development, scalable research platforms, high-throughput computing, AI tool integration, and end-to-end solution delivery.

      As **AI R&D Manager and Special Assistant to the General Manager at Repurgenesis**, I lead AI platform strategy, R&D roadmapping, cross-functional execution, and product delivery. I have contributed to building both the company and its core AI platform from 0 to 1, integrating AI models, data pipelines, and scientific tools into practical R&D solutions. Alongside this role, I am pursuing an **M.S. in Data Science at National Taiwan University**.

      Previously, I conducted AI research at Academia Sinica, the University of Florida, and Virginia Tech, developing predictive, generative, and multimodal models, biomedical AI platforms, and large-scale computational workflows. At Cathay Financial Holdings, I worked on enterprise data science and FinTech applications. These experiences enable me to bridge research depth with product and business requirements.

      I have authored multiple peer-reviewed AI publications as first author and was selected as a **2026 NVIDIA GTC Poster Finalist** for an AI orchestration framework for drug R&D. Going forward, I am focused on AI platform strategy, solutions architecture, AI product development, and technical leadership—turning advanced AI capabilities into scalable products with real-world and business impact.
    skills:
      enable: true
      title: "Core Expertise"
      items:
        - "AI Platform Strategy & Solutions Architecture"
        - "Agentic AI, RAG & Knowledge Systems"
        - "AI R&D Leadership & Product Delivery"
        - "AI for Science & High-Throughput Computing"

  

