  # Projects
  projects:
    enable: true
    maxItems: 0
    items:
      - title: Cross-Domain Multimodal Contrastive Learning for RNA–Ligand Binding Affinity
        content: Cross-domain multimodal contrastive learning framework for RNA–ligand binding affinity prediction, integrating RNA sequences and ligand SMILES embeddings from large language models (LLMs; RiNALMo, SMI-TED) with 3D structural information into a CLIP-based foundation model.
        image: /img/projects/1.png
        badges: ["RNA", "Ligand", "CLIP", "LLM"]
        links:
          - icon: fab fa-github
            url: https://github.com/LinTzuTang/RLC-CLIP/tree/main/CoRSA

      - title: AI4AMP — Antimicrobial Peptide Predictor
        content: Physicochemical encoding + deep learning (CNN/LSTM) for AMP prediction; part of AI-driven peptide platform.
        image: /img/projects/3.png
        badges: ["AMP", "CNN", "LSTM", "Web"]
        links:
          - icon: fab fa-github
            url: https://github.com/LinTzuTang/AI4AMP_predictor

      - title: GIGN for RNA–Ligand Binding Affinity
