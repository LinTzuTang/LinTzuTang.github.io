  experience:
    enable: true
    title: "Experience"
    items:
      - job: "AI R&D Manager & Special Assistant to the GM"
        company: "Repurgenesis"
        companyUrl: ""
        date: "Sep 2025 – Present"
        content: |
          - Lead **AI platform strategy and R&D roadmapping**, translating scientific workflows into prioritized modules, development milestones, and product plans.
          - Architected the integration of four domain-specific R&D modules into a unified **agentic AI platform** combining scientific tools, RAG, knowledge graph reasoning, automated SOPs, evidence scoring, and human-in-the-loop review.
          - Lead development of a scalable structure-based drug repurposing platform integrating proprietary data, automated molecular preparation, docking, affinity prediction, and candidate ranking.
          - Evaluated NVIDIA BioNeMo, NeMo Agent Toolkit, and NIM for AI for Science architecture and GPU-accelerated delivery; first-authored a **2026 NVIDIA GTC Poster Finalist** submission ranked **Top 8 of 158**.
          - Support the General Manager across corporate strategy, fundraising preparation, R&D prioritization, external partnerships, and product positioning.
          - Translate technical capabilities into investor materials, executive presentations, board-level AI education, and partner demonstrations.

      - job: "Research Assistant"
        company: "University of Florida — College of Pharmacy"
        companyUrl: "https://pharmacy.ufl.edu/"
        date: "May 2024 – Aug 2025"
        content: |
          - Developed a multimodal foundation model integrating RNA sequences, molecular representations, and 3D structural information for RNA–ligand binding affinity prediction and virtual screening.
          - Built large-scale AI training, tuning, and screening workflows on a **100+ NVIDIA A100 GPU cluster**, processing up to **10 million molecular inputs** through automated data pipelines and SLURM-managed computing.

      - job: "Research Assistant"
        company: "Virginia Tech — Dept of Computer Science"
        companyUrl: "https://cs.vt.edu/" 
        date: "Aug 2023 – Apr 2024"
        content: |
          - Developed **PathoVF**, an AI bioinformatics tool combining multimodal DNA representations, protein descriptors, protein language model embeddings, and machine learning for pathogenicity and virulence prediction.
          - Built TB-scale metagenomic pipelines for sequence analysis, taxonomic profiling, and detection of antimicrobial-resistance and virulence-associated signals.

      - job: "Data Scientist"
        company: "Cathay Financial Holdings — Data Science Lab"
        companyUrl: "https://www.cathayholdings.com/holdings/eng/home"
        date: "Dec 2022 – May 2023"
        content: |
          - Developed enterprise AI proof-of-concept solutions across FinTech and healthcare, including signature recognition, synthetic financial data generation, federated AI agents, and clinical risk prediction.
          - Built an EHR-based ICU sepsis early-warning model using a Feature Tokenizer Transformer, achieving **0.915 accuracy** in internal evaluation.
          - Used AWS EC2, SageMaker, and S3 for scalable model development and secure data workflows; partnered with business, healthcare, and technical stakeholders and instructed Cathay General Hospital’s Data Science Workshop.
          
      - job: "Bioinformatics Engineer / Research Assistant"
        company: "Academia Sinica — Institute of Information Science"
        companyUrl: "https://www.iis.sinica.edu.tw/en/index.html"
        date: "Jul 2018 – Dec 2022"
        content: |
          - Led development of **AI Fleming**, an AI-driven antimicrobial peptide discovery platform spanning data curation, predictive modeling, generative design, candidate prioritization, and experimental validation.
          - Developed CNN, LSTM, Doc2Vec, ensemble, and WGAN-GP models for peptide activity prediction and de novo sequence generation.
          - Designed AI-generated peptide candidates; **2 of 8** experimentally validated candidates demonstrated in vitro activity against cancer cells and antibiotic-resistant bacteria, with MIC values of **2–45 μg/mL**.
          - Integrated multiple predictive models into the public **AI4AXP** platform and developed the PC6 protein encoding method used in AI4AMP; contributed to work recognized with the **20th National Innovation Award**.

