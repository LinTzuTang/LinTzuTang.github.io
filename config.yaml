    items:
      - title: Cross-Domain Multimodal Contrastive Learning for RNA–Ligand Binding Affinity
        content: Built a CLIP-style framework integrating RNA sequence, ligand SMILES (RiNALMo, SMI-TED), and 3D features; achieved Test RMSE ~1.68 vs 1.85 benchmark.
        image: /img/projects/rna-ligand.png
        badges: ["CLIP-style", "GNN", "3D"]
        links:
          - icon: fab fa-github
            url: https://github.com/LinTzuTang/RLC-CLIP/tree/main/CoRSA
      - title: RNA-targeted Virtual Screening & Docking
        content: Scaled RNAmigos screening to ~10M molecules across 3 RNAs; evaluated with AutoDock Vina; generated decoys with DeepCoy for benchmarking.
        image: /img/projects/vs.png
        badges: ["RNAmigos", "Vina", "DeepCoy"]
        links:
          - icon: fab fa-github
            url: https://github.com/LinTzuTang/rnamigo2/tree/main/rnamigos
      - title: Generative Protein Design
        content: RFdiffusion for backbone → AlphaFold for structure → ProteinMPNN for sequence; iterative design loop.
        image: /img/projects/protein.png
        badges: ["RFdiffusion", "AlphaFold", "ProteinMPNN"]
        links:
          - icon: fab fa-github
            url: https://github.com/LinTzuTang/cheminformatics/tree/main/RFdiffusion-Protein-Design

