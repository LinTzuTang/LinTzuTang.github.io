  # Projects
  projects:
    enable: true
    maxItems: 0
    items:
      - title: Cross-Domain Multimodal Contrastive Learning for RNA–Ligand Binding Affinity
        content: CLIP-style cross-modal foundation model integrating RNA sequences, LLM SMILES (RiNALMo/SMI-TED), and 3D features for RNA–small-molecule affinity; supports downstream fine-tuning.
        image: /img/projects/1.png
        badges: ["RNA","Ligand","CLIP","LLM","Python","Prediction"]
        links:
          - icon: fab fa-github
            url: https://github.com/LinTzuTang/RLC-CLIP

      - title: GIGN for RNA–Ligand Binding Affinity
        content: Fine-tuned/retrained Geometric Interaction Graph Neural Network (GIGN) for RNA–ligand interaction modeling with packaged training/inference.
        image: /img/projects/4.png
        badges: ["RNA","Ligand","GNN","GIGN","Python","Benchmarking","Prediction"]
        links:
          - icon: fab fa-github
            url: https://github.com/LinTzuTang/GIGN

      - title: Sepsis Early Prediction with FT Transformer (CGH)
        content: EHR-based early sepsis prediction prototype using FT Transformer—data processing → featurization → training/evaluation; reproducible notebooks & scripts.
        image: /img/projects/7.png
        badges: ["Healthcare","EHR","Transformer","Python","Pipeline","Prediction"]
        links:
          - icon: fab fa-github
            url: https://github.com/LinTzuTang/tabular_data_modeling

      - title: RLaffinity — 3D-CNN Contrastive Inference
        content: Reproducible inference & retraining workflow for a 3D-CNN contrastive model on nucleic acid–ligand binding; scripts for data prep and evaluation.
        image: /img/projects/2.jpg
        badges: ["RNA","Ligand","3D-CNN","Contrastive","Python","Benchmarking","Prediction"]
        links:
          - icon: fab fa-github
            url: https://github.com/LinTzuTang/RLaffinity

